# LOCAL DEV ONLY, not an approved production topology.
services:
  idps-mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Provide local MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-idps_db}
      MYSQL_USER: ${MYSQL_USER:-idps_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Provide local MYSQL_PASSWORD}
      TZ: UTC
    ports:
      - "127.0.0.1:${MYSQL_BIND_PORT:-3306}:3306"
    volumes:
      - idps_mysql_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 4s
      retries: 15
volumes:
  idps_mysql_data: {}
